[project]
name = "yap-machine"
version = "0.1.0"
description = "Point your agent at a folder of talking-to-camera footage. Get back a cut that makes sense."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.66.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.9,<5",
]

[project.scripts]
yap-machine = "yap.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/yap"]

# the agent skill ships inside the package, so `yap-machine skill` works for anyone who installed only the engine
[tool.hatch.build.targets.wheel.force-include]
"skill/SKILL.md" = "yap/SKILL.md"
"studio/src" = "yap/visual-studio/src"
"studio/public/fonts" = "yap/visual-studio/public/fonts"
"studio/catalog.json" = "yap/visual-studio/catalog.json"
"studio/render.mjs" = "yap/visual-studio/render.mjs"
"studio/person-mask.swift" = "yap/visual-studio/person-mask.swift"
"studio/package.json" = "yap/visual-studio/package.json"
"studio/package-lock.json" = "yap/visual-studio/package-lock.json"
"studio/tsconfig.json" = "yap/visual-studio/tsconfig.json"
"studio/STYLE-STUDIO-LICENSE" = "yap/visual-studio/STYLE-STUDIO-LICENSE"
"studio/README.md" = "yap/visual-studio/README.md"
