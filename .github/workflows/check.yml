name: Check source install
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desk/package-lock.json
            studio/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install from source
        run: ./scripts/install
      - name: Check engine
        run: |
          uv sync --frozen --extra dev
          uv run --frozen --extra dev pytest -q
      - name: Check editor and styles
        run: |
          npm --prefix desk run typecheck
          npm --prefix desk test -- --maxWorkers=1
          npm --prefix studio run typecheck
      - name: Check local agent setup
        run: |
          mkdir -p "$HOME/.codex"
          node desk/dist/cli/index.js setup --local --only codex --dry-run
